name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        working-directory: android
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: familia-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Solo en la rama version-pago: deja el APK en una rama aparte para poder bajarlo directo
      - name: Guardar el APK en la rama apk-pago
        if: github.ref == 'refs/heads/version-pago'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/familia-tv-pago.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk-pago
          git rm -rf -q --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/familia-tv-pago.apk familia-tv-pago.apk
          git add -f familia-tv-pago.apk
          git commit -q -m "APK versión pago"
          git push -f origin apk-pago
